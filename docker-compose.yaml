version: '3.8'

services:
  payment-service:
    build: .
    container_name: payment-service-app
    ports:
      - "${APP_PORT}:8085"
    environment:
      APP_PORT: 8085
      MONGO_URI: mongodb://${ROOT_USERNAME:-admin}:${ROOT_PASSWORD:-password}@mongo-db:27017/${DB_NAME:-payment_db}?authSource=admin
      BOOTSTRAP_SERVER: kafka:29092
      PAYMENT_PRODUCER_TOPIC: create-payment
      PAYMENT_CONSUMER_TOPIC: create-order
      GROUP_ID: payment-service-group
      RANDOM_API_URL: https://www.random.org/integers/?num=1&min=1&max=100&col=1&base=10&format=plain&rnd=new
    depends_on:
      - mongo-db
      - kafka
    restart: on-failure

  mongo-db:
    image: mongo:6.0
    container_name: payment_mongo_db
    restart: always
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${DB_NAME:-payment_db}
    volumes:
      - mongo_data:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: payment_zookeeper
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: payment_kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  mongo_data: