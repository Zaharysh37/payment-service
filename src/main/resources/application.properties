spring.profiles.active=${SPRING_PROFILES_ACTIVE}
spring.application.name=payment-service

server.port=${APP_PORT}

spring.data.mongodb.uri=mongodb://${ROOT_USERNAME}:${ROOT_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${DB_NAME}?authSource=admin
spring.data.mongodb.database=payment_db
spring.data.mongodb.auto-index-creation=false

spring.liquibase.enabled=true
spring.liquibase.change-log=db/changelog/db.changelog-master.json

random.api.url=${RANDOM_API}
kafka.topics.producer=${PAYMENT_PRODUCER_TOPIC}
kafka.topics.consumer=${PAYMENT_CONSUMER_TOPIC}

spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true

spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVER}
spring.kafka.consumer.group-id=${GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.innowise.paymentservice.api.dto.eventdto.OrderEventDto

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true